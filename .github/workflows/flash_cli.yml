name: Flasher CLI (Windows, Linux)

# esp_flash_cli: command-line flasher for the ESP32-S3 SDR firmware (and the test of the
# flasher the SDR++ module uses). Windows build with MinGW, static.
on:
    push:
        paths: ['src/esp_flasher.*', 'src/esp_sdr_client.*', 'tools/esp_flash_cli.cpp', '.github/workflows/flash_cli.yml']
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: Toolchains
          run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64-x86-64-posix
        - name: Build
          run: |
            x86_64-w64-mingw32-g++-posix -Os -s -std=c++17 -static -Isrc tools/esp_flash_cli.cpp src/esp_flasher.cpp src/esp_sdr_client.cpp -o esp_flash_cli.exe
            g++ -O2 -std=c++17 -Isrc tools/esp_flash_cli.cpp src/esp_flasher.cpp src/esp_sdr_client.cpp -o esp_flash_cli -lpthread
        - uses: actions/upload-artifact@v4
          with:
              name: esp_flash_cli
              path: |
                esp_flash_cli.exe
                esp_flash_cli
